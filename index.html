    range.setAttribute('aria-valuetext', fineTime(now));
    s.q('.name').textContent = t('video', { n: s.i + 1 }) + ' · ' + fineTime(now);
  }
  function renderZoom(s) {
    const zoomed = s.view.scale > 1;
    const amount = s.q('.amount');
    amount.hidden = !zoomed;
    amount.textContent = zoomLabel(s.view.scale);
    s.q('.whole').hidden = !zoomed;
    s.q('.zout').setAttribute('aria-disabled', String(!zoomed));
    s.q('.zin').setAttribute('aria-disabled', String(s.view.scale >= MAX_ZOOM));
  }
  function renderSide(s) {
    const name = t('video', { n: s.i + 1 });
    const has = s.ready || !!s.url;
    s.el.setAttribute('aria-label', name);
    s.q('.empty').hidden = has;
    s.q('.over.top').hidden = !has;
    s.q('.over.bottom').hidden = !s.ready;
    const err = s.q('.err');
    err.hidden = !s.problem;
    err.textContent = s.problem ? t(s.problem) : '';
    s.q('.privacy').hidden = s.i !== 0 || !!s.problem;
    s.q('.same').hidden = !(s.i === 1 && sides[0] && sides[0].file);
    const playing = s.ready && !s.video.paused && !s.video.ended;
    const own = s.q('.own');
    own.innerHTML = playing ? ICON.pause : ICON.play;
    label(own, playing ? t('pauseThis') : t('playThis'));
    label(s.q('.prev'), t('prevFrame'), t('keyShift') + '+←');
    label(s.q('.next'), t('nextFrame'), t('keyShift') + '+→');
    label(s.q('.mark'), t('setStart'), 'M');
    label(s.q('.zin'), t('zoomIn') + ': ' + name, 'Z');
    label(s.q('.zout'), t('zoomOut') + ': ' + name, t('keyShift') + '+Z');
    label(s.q('.whole'), t('whole') + ': ' + name, '0');
    label(s.q('.change'), t('change') + ': ' + name);
    const range = s.q('input[type=range]');
    range.setAttribute('aria-label', t('position') + ', ' + name);
    ['.own', '.prev', '.next', '.mark'].forEach((c) => { s.q(c).disabled = !s.ready; });
    range.disabled = !s.ready;
    const snd = s.q('.sound');
    const on = sound === s.i;
    snd.setAttribute('aria-pressed', String(on));
    label(snd, on ? t('soundOff') + ': ' + name : t('soundOn') + ': ' + name);
    const disc = $('.disc', snd);
    disc.innerHTML = on ? ICON.soundOn : ICON.soundOff;
    disc.classList.toggle('on', on);
    s.q('.start').textContent = t('startAt', { t: fineTime(s.start) });
    s.video.setAttribute('aria-label', name);
    renderZoom(s);
    renderTime(s);
  }
  function renderFooter() {
    const playing = anyPlaying();
    const list = live();
    playBothBtn.innerHTML = (playing ? ICON.pause : ICON.play) + '<span></span>';
    $('span', playBothBtn).textContent = playing ? t('pause') : t('playBoth');
    playBothBtn.setAttribute('aria-disabled', String(!list.length));
    playBothBtn.setAttribute('aria-keyshortcuts', playing ? 'Space' : 'T');
    playBothBtn.title = !list.length ? t('pickFirst') : refused ? t('cantStart') : playing ? t('pause') + ' (' + t('keySpace') + ')' : t('playBothTip') + ' (T)';
    const away = list.some((s) => Math.abs(s.video.currentTime - s.start) > 0.05 && !s.video.ended);
    resumeBtn.hidden = playing || !away;
    resumeBtn.textContent = t('resume');
    resumeBtn.title = t('resumeTip') + ' (' + t('keySpace') + ')';
    resumeBtn.setAttribute('aria-keyshortcuts', 'Space');
  }
  function renderSpeed() {
    speedEl.setAttribute('aria-label', t('speed'));
    speedEl.textContent = '';
    RATES.forEach((r) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', String(r === rate));
      b.tabIndex = r === rate ? 0 : -1;
      b.textContent = rateLabel(r);
      b.title = t('speed') + ' ' + rateLabel(r) + ' (− / +)';
      b.addEventListener('click', () => { setRate(r); speedEl.querySelector('[aria-checked="true"]').focus(); });
      b.addEventListener('keydown', (e) => {
        const i = RATES.indexOf(rate);
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); e.stopPropagation(); setRate(RATES[Math.min(RATES.length - 1, i + 1)]); speedEl.querySelector('[aria-checked="true"]').focus(); }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); setRate(RATES[Math.max(0, i - 1)]); speedEl.querySelector('[aria-checked="true"]').focus(); }
      });
      speedEl.appendChild(b);
    });
  }
  function renderAll() {
    document.documentElement.lang = lang;
    document.title = t('appName');
    const meta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
    if (meta) meta.content = t('homeName');
    document.querySelectorAll('[data-t]').forEach((n) => { n.textContent = t(n.getAttribute('data-t')); });
    document.querySelectorAll('[data-tl]').forEach((n) => { label(n, t(n.getAttribute('data-tl')), '?'); });
    sides.forEach(renderSide);
    renderFooter();
    renderSpeed();
    if ($('#keysSheet').open) renderKeys();
  }
  const langSel = $('#lang');
  LANGS.forEach((code) => {
    const o = document.createElement('option');
    o.value = code;
    o.lang = code;
    o.textContent = LANG_NAMES[code];
    langSel.appendChild(o);
  });
  langSel.value = lang;
  langSel.addEventListener('change', () => {
    if (!STRINGS[langSel.value]) return;
    lang = langSel.value;
    save(LANG_KEY, lang);
    renderAll();
  });
  sides[0].el.classList.add('active');
  renderAll();
  if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {  });
  }
  window.__vertailu = { sides: sides, get lang() { return lang; }, get rate() { return rate; }, get pairOffset() { return pairOffset; } };
})();
</script>
</body>
</html>
