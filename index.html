  function wide() { return window.matchMedia('(min-width: 1000px) and (min-height: 560px)').matches; }
  function fitCrowd(s) {
    const b = s.box;
    if (!s.ready) return;
    const tops = [...b.querySelectorAll('.over.top .chip, .over.top button')].filter((e) => !e.closest('[hidden]')).map((e) => e.getBoundingClientRect()).filter((r) => r.width);
    const bottoms = [...b.querySelectorAll('.over.bottom .chip, .over.bottom button')].filter((e) => !e.closest('[hidden]')).map((e) => e.getBoundingClientRect()).filter((r) => r.width);
    const br = b.getBoundingClientRect();
    const out = (r) => r.top < br.top - 0.5 || r.bottom > br.bottom + 0.5;
    const hit = tops.some((a) => bottoms.some((c) => a.left < c.right && a.right > c.left && a.top < c.bottom && a.bottom > c.top)) || tops.concat(bottoms).some(out);
    if (!hit) return;
    b.classList.add('crowded');
    const top = [...b.querySelectorAll('.over.top .chip, .over.top button')].filter((e) => !e.closest('[hidden]')).map((e) => e.getBoundingClientRect()).filter((r) => r.width);
    if (top.some(out)) b.classList.add('crowded2');
  }
  const NARROW_PX = 260;
  const COVER_SHARE = 0.12;
  function fitBars(s) {
    s.box.classList.remove('crowded', 'crowded2', 'crowded3');
    s.el.classList.remove('zoomrow');
    s.el.querySelectorAll('.zoombar').forEach((z) => { z.hidden = true; });
    placeLabels(s);
    fitCrowd(s);
    const row = s.box.classList.contains('crowded');
    s.el.classList.toggle('zoomrow', row);
    s.q('.zoombar:not(.inctl)').hidden = !row || syncing;
    s.q('.zoombar.inctl').hidden = !row || !syncing;
    const br = s.box.getBoundingClientRect();
    const outside = () => [...s.box.querySelectorAll('.over.top .chip, .over.top button')].some((e) => {
      if (e.closest('[hidden]') || getComputedStyle(e).display === 'none') return false;
      const r = e.getBoundingClientRect(); return r.width && (r.top < br.top - 0.5 || r.bottom > br.bottom + 0.5);
    });
    if (outside()) s.box.classList.add('crowded', 'crowded2');
    if (outside()) s.box.classList.add('crowded3');
  }
  function placeLabels(s) {
    const b = s.box;
    b.classList.remove('bars', 'sidecols');
    b.style.removeProperty('--side');
    if (!s.ready || !s.pic) return;
    const W = b.clientWidth, H = b.clientHeight;
    if (!W || !H) return;
    const k = Math.min(W / s.pic.width, H / s.pic.height);
    const pw = s.pic.width * k, ph = s.pic.height * k;
    const pl = (W - pw) / 2, pt = (H - ph) / 2;
    const br = b.getBoundingClientRect();
    let hit = false;
    let covered = 0;
    b.querySelectorAll('.over > *, .over .labels > *, .over .row > *').forEach((e) => {
      if (e.hidden || e.classList.contains('grow') || e.classList.contains('labels') || e.classList.contains('row')) return;
      const r = e.getBoundingClientRect();
      if (!r.width || !r.height) return;
      const l = r.left - br.left, tp = r.top - br.top;
      const ow = Math.min(l + r.width, pl + pw) - Math.max(l, pl), oh = Math.min(tp + r.height, pt + ph) - Math.max(tp, pt);
      if (ow > 0 && oh > 0) { hit = true; covered += ow * oh; }
    });
    const narrow = W < NARROW_PX;
    if (!(hit && (narrow || covered > COVER_SHARE * pw * ph))) return;
    const full = Math.min(W / s.pic.width, H / s.pic.height);
    const keeps = () => { const r = s.stage.getBoundingClientRect(); return Math.min(r.width / s.pic.width, r.height / s.pic.height) >= full * 0.995; };
    if (H - ph >= 88) {
      b.classList.add('bars');
      if (keeps()) return;
      b.classList.remove('bars');
    }
    const sideRoom = (W - pw) / 2;
    const need = Math.max(60, ...['.change span', '.whole span'].map((q) => s.q(q).scrollWidth + 8));
    if (sideRoom >= need) { b.classList.add('sidecols'); b.style.setProperty('--side', Math.floor(sideRoom) + 'px'); }
  }
  function renderSeg(el, group, items, current, pick) {
    el.setAttribute('aria-label', group);
    el.textContent = '';
    items.forEach((it, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', String(it.value === current));

        const flip = document.documentElement.dir === 'rtl' ? -1 : 1;
        const d = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : e.key === 'ArrowRight' ? flip : e.key === 'ArrowLeft' ? -flip : 0;

  function focusChecked(el) { const b = el.querySelector('[aria-checked="true"]'); if (b) b.focus(); }
  function renderSegs() {
    [layoutEl, layoutMenuEl].forEach((box) => renderSeg(box, t('layout'), [
      { value: 'side', html: ICON.side + (box === layoutMenuEl ? '<span>' + t('layoutSide') + '</span>' : ''), label: t('layoutSide') },
      { value: 'stack', html: ICON.stack + (box === layoutMenuEl ? '<span>' + t('layoutStack') + '</span>' : ''), label: t('layoutStack') },
    ], layoutNow(), setLayout));
  }
  function layoutNow() { return layoutPick || (window.innerWidth > window.innerHeight ? 'side' : 'stack'); }
  function applyLayout() {
    const now = layoutNow();
    if (document.body.dataset.layout !== now) document.body.dataset.layout = now;
    [layoutEl, layoutMenuEl].forEach((box) => box.querySelectorAll('[role=radio]').forEach((b, i) => {
      const on = (i === 0 ? 'side' : 'stack') === now;
      b.setAttribute('aria-checked', String(on));
      b.tabIndex = on ? 0 : -1;
    }));
  }
  function setLayout(v) {
    layoutPick = v;
    save(LAYOUT_KEY, v);
    applyLayout();
  }
  window.addEventListener('resize', () => { applyLayout(); renderControls(); });
  function renderAll() {
    document.documentElement.lang = lang;
    document.documentElement.dir = RTL.includes(lang) ? 'rtl' : 'ltr';
    document.title = t('appName');
    const meta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
    if (meta) meta.content = t('homeName');
    const about = document.querySelector('meta[name="description"]');
    if (about) about.content = t('tagline');
    document.querySelectorAll('[data-t]').forEach((n) => { n.textContent = t(n.getAttribute('data-t')); });
    document.querySelectorAll('[data-tl]').forEach((n) => { label(n, t(n.getAttribute('data-tl')), '?'); });
    sides.forEach(renderSide);
    renderControls();
    renderSegs();
    renderUpdate();
    renderBuild();
    applyLayout();
    if ($('#keysSheet').open) renderKeys();
    renderInstall();
    if (tour.open) renderTour();
    maybeTips();
  }
  const langSel = $('#lang');
  LANGS.forEach((code) => {
    const o = document.createElement('option');
    o.value = code;
    o.lang = code;
    o.textContent = LANG_NAMES[code];
    langSel.appendChild(o);
  });
  langSel.value = lang;
  function setLang(code) {
    if (!STRINGS[code]) return;
    lang = code;
    langSel.value = code;
    save(LANG_KEY, lang);
    renderAll();
  }
  langSel.addEventListener('change', () => setLang(langSel.value));
  const BUILD = (() => { const m = document.querySelector('meta[name="vcc-build"]'); const [hash, date] = ((m && m.content) || '').split(' '); return { hash: hash || '', date: date || '' }; })();
  function renderBuild() {
    $('#buildLine').textContent = t('version', { date: BUILD.date, hash: BUILD.hash });
    const box = $('#aboutPrivacy');
    box.textContent = '';
    box.appendChild(el('p', '', t('tourPrivacy1')));
    box.appendChild(el('p', '', t('tourPrivacy2', { forget: t('forget') })));
    box.appendChild(el('p', 'muted', t('tourPrivacy3')));
  }
  let newer = null;
  let dismissedFor = null;
  const RELOAD_KEY = 'vcc-reloaded-for';
  function quiet() {
    const names = wanted();
    const allKept = sides.every((s, i) => !s.file || (names[i] && stored[names[i]] === s.file));
    const typing = document.activeElement && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    return allKept && !syncing && !player.playing && !document.querySelector('dialog[open]') && !typing && !sides.some((s) => s.restore);
  }
  async function reloadNow() {
    try { await keeping; } catch (e) {  }
    writePlace();
    keepPoints();
    location.reload();
  }
  function renderUpdate() {
    const bar = $('#updateBar');
    bar.hidden = !newer;
    $('#updateText').textContent = t('updateReady');
    $('#updateNow').textContent = t('updateNow');
    label($('#updateClose'), t('close'));
  }
  $('#updateNow').addEventListener('click', reloadNow);
  $('#updateClose').addEventListener('click', () => { dismissedFor = newer; newer = null; renderUpdate(); });
  let checking = false;
  async function checkVersion() {
    if (checking || location.protocol === 'file:' || !BUILD.hash) return;
    checking = true;
    try {

  }

  checkVersion();
  window.__vertailu = { sides: sides, get lang() { return lang; }, get rate() { return rate; }, get layout() { return layoutNow(); }, get points() { return points; }, get syncing() { return syncing; }, player: player, kept: () => keeping };
})();
